[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8889

# Headers de seguridad no condicionales al contexto (sí aplican en dev y
# producción por igual, no hay riesgo de romper HMR con estos).
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

# Content-Security-Policy: aplicado por netlify/edge-functions/csp-headers.js
# en vez de un header estático acá. Motivo: script-src con hashes fijos es
# incompatible con `netlify dev` (Vite inyecta un script de HMR con
# contenido/hash variable en cada arranque). La edge function chequea
# context.deploy?.context en runtime y solo agrega el CSP estricto cuando
# NO es dev — sin depender de recordar revertir nada a mano.

# /:tienda/o/:oferta → Edge Function oferta-og (netlify/edge-functions/):
#   • Crawler (WhatsApp/FB/…) → HTML con meta tags OG de la oferta.
#   • Humano → context.next() → cae en el catch-all → index.html (SPA React),
#     que monta OfertaIndividual en la MISMA URL. Sin redirect, sin loop.
# La edge ya declara su ruta con config.path; se lista acá para dejarlo explícito.
[[edge_functions]]
  path = "/:tienda/o/:oferta"
  function = "oferta-og"

# /:slug → Edge Function tienda-og: mismo patrón que oferta-og, para el home
# de la tienda (antes sin ningún OG dinámico). No colisiona con la de arriba
# (3 segmentos vs 1, nunca matchean la misma URL). RESERVED dentro de la
# función deja pasar /admin, legales y assets estáticos de raíz sin generar OG.
[[edge_functions]]
  path = "/:slug"
  function = "tienda-og"

# Content-Security-Policy dinámico — ver comentario arriba. path = "/*" para
# cubrir toda la app (home, admin, panel, oferta), corre en TODAS las rutas
# antes que el resto de la respuesta.
[[edge_functions]]
  path = "/*"
  function = "csp-headers"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
