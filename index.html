<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-dark.jpg" />
    <meta name="theme-color" content="#00B8D9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lokal — Encontrá lo que buscás</title>
    <meta name="description" content="Publicá lo que necesitás y que las tiendas locales te respondan." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins variable + Inter variable: font-weight cinético sin layout shifts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- El seteo de fondo de <body> según tema (antes acá como <script>
         inline) ahora vive en theme-init.js (ver ese archivo) — necesario
         para que script-src del CSP de producción pueda quedar sin hashes
         fijos y permitir el script inline dinámico de Google Identity
         Services durante el login. -->
    <!-- Splash HTML estático sacado: quedaba superpuesto con el splash de
         React (AdminLoader/SplashScreenFull en Root.jsx, TiendaPublica.jsx)
         — dos diseños distintos en secuencia (ícono cuadrado icon-light.jpg
         primero, logo SVG animado después), se veía como carga duplicada.
         El fondo de <body> ya cubre el instante entre parseo HTML y montaje
         de React (unos ms, imperceptible), y React trae su propio splash
         completo desde el primer render. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
