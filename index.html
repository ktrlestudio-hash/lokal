<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-dark.jpg" />
    <meta name="theme-color" content="#00B8D9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lokal — Encontrá lo que buscás</title>
    <meta name="description" content="Publicá lo que necesitás y que las tiendas locales te respondan." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins variable + Inter variable: font-weight cinético sin layout shifts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <script>
      (function(){
        var t=localStorage.getItem('lokal-theme');
        var dark=t!=='light';
        var bg=dark?'#060d1a':'#ffffff';
        document.body.style.background=bg;
        document.getElementById&&(document.querySelector&&(function(){
          var s=document.getElementById('splash');
          if(s)s.style.background=bg;
        })());
        window.__initBg=bg;
      })();
    </script>
    <div id="splash" style="
      position:fixed;inset:0;z-index:9998;
      display:flex;align-items:center;justify-content:center;
      transition:opacity 0.3s ease;
    ">
      <script>document.currentScript.parentElement.style.background=window.__initBg||'#060d1a';</script>
      <img src="/icon-light.jpg" alt="Lokal" style="
        width:80px;height:80px;
        border-radius:20px;
        opacity:0;
        animation:splashIn 0.4s ease 0.1s forwards;
      " />
      <style>
        @keyframes splashIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
