<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-dark.jpg" />
    <!-- Oscuro (no el celeste de marca) para que coincida con el fondo real
         que theme-init.js aplica al <html> ANTES de que React monte, y con
         el splash inicial (#040a14/#060d1a) — antes quedaba celeste acá,
         así que la barra de estado de la PWA (Android/iOS toman este color
         como referencia inicial) mostraba celeste→oscuro→celeste en la
         carga: dos saltos en vez de uno solo prolijo (oscuro durante todo
         el splash, celeste recién cuando el admin real ya está en pantalla). -->
    <meta name="theme-color" content="#040a14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Título y descripción del producto REAL: antes describían el modelo
         de LOKAL global ("publicá lo que necesitás y que las tiendas
         respondan"), que son las demandas — un módulo que LOKAL LINKS no
         tiene. Las páginas de tienda y de oferta sobreescriben estos meta
         en el edge (netlify/edge-functions/oferta-og.js); esto es lo que se
         sirve en la raíz, o sea la landing. -->
    <title>LOKAL LINKS — Tu negocio en un solo link</title>
    <meta name="description" content="Armá la página de tu negocio con tus ofertas y compartila por WhatsApp o Instagram. Gratis para empezar, sin instalar nada." />
    <link rel="canonical" href="https://lokallinks.netlify.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph — sin esto, compartir el link en WhatsApp/Facebook no
         muestra previsualización (solo la URL pelada). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LOKAL LINKS" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://lokallinks.netlify.app/" />
    <meta property="og:title" content="LOKAL LINKS — Tu negocio en un solo link" />
    <meta property="og:description" content="Armá la página de tu negocio con tus ofertas y compartila por WhatsApp o Instagram. Gratis para empezar, sin instalar nada." />
    <meta property="og:image" content="https://lokallinks.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LOKAL LINKS — la página de tu negocio en un link" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LOKAL LINKS — Tu negocio en un solo link" />
    <meta name="twitter:description" content="Armá la página de tu negocio con tus ofertas y compartila por WhatsApp o Instagram." />
    <meta name="twitter:image" content="https://lokallinks.netlify.app/og.png" />

    <!-- Datos estructurados: los validadores de enlace y buscadores los usan
         para entender qué es el sitio y mostrar resultados enriquecidos. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LOKAL LINKS",
        "url": "https://lokallinks.netlify.app/",
        "description": "Armá la página de tu negocio con tus ofertas y compartila por WhatsApp o Instagram.",
        "inLanguage": "es-AR"
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- El botón de Google (GIS) primero dibuja el genérico "Continuar con
         Google" y recién tras consultar la sesión lo reemplaza por el
         personalizado. Abrir la conexión de antemano acorta esa ventana. -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <!-- Poppins variable + Inter variable: font-weight cinético sin layout shifts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- El seteo de fondo de <body> según tema (antes acá como <script>
         inline) ahora vive en theme-init.js (ver ese archivo) — necesario
         para que script-src del CSP de producción pueda quedar sin hashes
         fijos y permitir el script inline dinámico de Google Identity
         Services durante el login. -->
    <!-- Splash HTML estático sacado: quedaba superpuesto con el splash de
         React (AdminLoader/SplashScreenFull en Root.jsx, TiendaPublica.jsx)
         — dos diseños distintos en secuencia (ícono cuadrado icon-light.jpg
         primero, logo SVG animado después), se veía como carga duplicada.
         El fondo de <body> ya cubre el instante entre parseo HTML y montaje
         de React (unos ms, imperceptible), y React trae su propio splash
         completo desde el primer render. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
